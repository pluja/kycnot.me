[project]
name = "pyworker"
version = "0.1.0"
description = "AI workers for kycnot.me"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "croniter>=6.0.0",
    "json-repair>=0.41.1",
    "openai>=1.74.0",
    "psycopg[binary,pool]>=3.2.6",
    "python-dotenv>=1.1.0",
    "requests>=2.32.3",
]

[project.scripts]
pyworker = "pyworker.cli:main"

[tool.setuptools]
packages = ["pyworker"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.5",
]
