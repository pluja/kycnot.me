name: Deploy preprod

# Deploys on demand, never on ordinary pushes. Either point the preprod branch
# at the commit you want (`just preprod`, or `git push -f origin HEAD:preprod`),
# or open Actions > Deploy preprod > Run workflow and pick a branch there.
on:
  push:
    branches:
      - preprod
  workflow_dispatch:
    inputs:
      database:
        description: "auto: reset preprod from the latest prod dump only when the database holds migrations this branch lacks. keep: never reset. sync-prod: always reset."
        type: choice
        default: auto
        options:
          - auto
          - keep
          - sync-prod

concurrency:
  group: preprod-deploy
  cancel-in-progress: false

env:
  ASTRO_IMAGE: tig.cx/pluja/kycnot/astro
  PYWORKER_IMAGE: tig.cx/pluja/kycnot/pyworker

jobs:
  build-and-deploy:
    runs-on: preprod
    steps:
      - name: Checkout
        run: |
          set -euo pipefail

          rm -rf "$FORGEJO_WORKSPACE"
          mkdir -p "$FORGEJO_WORKSPACE"
          cd "$FORGEJO_WORKSPACE"

          git init -q
          git remote add origin "$FORGEJO_SERVER_URL/$FORGEJO_REPOSITORY.git"
          git -c http.extraHeader="Authorization: token $FORGEJO_TOKEN" fetch -q origin \
            "+refs/heads/master:refs/remotes/origin/master" "$FORGEJO_SHA"
          git checkout -q --detach "$FORGEJO_SHA"

      - name: Check commits
        working-directory: ${{ forgejo.workspace }}
        env:
          ALLOWED_AUTHOR_EMAILS: ${{ vars.ALLOWED_AUTHOR_EMAILS }}
          FORBIDDEN_STRINGS: ${{ vars.FORBIDDEN_STRINGS }}
        run: |
          set -euo pipefail
          base="$(git merge-base origin/master HEAD)"
          scripts/ci/check-commits.sh "$base" HEAD

      - name: Reclaim disk from old deploy images
        run: |
          set -euo pipefail
          # Old build images pile up until the disk fills. Images no container
          # uses go; the BuildKit layer cache stays, capped, so the next build
          # only redoes what changed.
          docker images --format '{{.Repository}}:{{.Tag}}' --filter 'reference=tig.cx/pluja/kycnot/*' \
            | while IFS= read -r image; do
                docker ps -a --format '{{.Image}}' | grep -qxF "$image" || docker image rm "$image" >/dev/null 2>&1 || true
              done
          docker image prune -f >/dev/null || true
          docker builder prune -f --keep-storage 8GB >/dev/null || true

      # Built with the host's docker, so the stack on this machine sees the
      # image at once. Preprod images never go to the registry.
      - name: Build images
        id: images
        working-directory: ${{ forgejo.workspace }}
        run: |
          set -euo pipefail

          short_sha="$(printf '%s' "$FORGEJO_SHA" | cut -c1-8)"
          branch_slug="$(printf '%s' "$FORGEJO_REF_NAME" | tr -c 'A-Za-z0-9._-' '-' | cut -c1-40)"
          image_tag="pre-${branch_slug}-${short_sha}"

          docker build \
            -f web/Dockerfile \
            --build-arg ASTRO_BUILD_MODE=staging \
            -t "${ASTRO_IMAGE}:${image_tag}" \
            .
          docker build \
            -t "${PYWORKER_IMAGE}:${image_tag}" \
            ./pyworker

          echo "image_tag=${image_tag}" >> "$FORGEJO_OUTPUT"

      - name: Deploy preprod
        run: |
          set -euo pipefail

          /opt/forgejo-runner/bin/deploy-pre "${{ steps.images.outputs.image_tag }}" "${{ inputs.database || 'auto' }}"
